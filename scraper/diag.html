,"storySixthP":"У березні 2018 вперше ми випустили жіночу колекцію, яка стала черговим підтвердженням того, що постійний розвиток - головна риса компанії.","chooseCity":"Виберіть місто зі списку","choosePostOffis":"Виберіть відділення зі списку","useBonuses":"Використати бонуси","amountToPay":"Сума до оплати за товар","needToSelectBranch":"Спочатку необхідно вибрати відділення","finalCostMayDiffer":"Остаточна вартість перевезення може відрізнятися від розрахованої","buyerData":"Дані покупця","payment":"Оплата","wantToRegister":"Хочу зареєструватися","anonymousOrderText":"Щоб отримати бонуси, потрібно зареєструватися.","cooperationContentPage":"\u003cp\u003eМи український бренд одягу, 80% нашого асортименту виготовляється на власних цехах в Україні, що дозволяє нам дотримуватися політики доступних цін і відмінної якості.\u003c/p\u003e\n\u003cp\u003e\u003cb\u003eКілька фактів про нас:\u003c/b\u003e\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eяк мінімум один або двоє ваших знайомих або друзів одягається у нас;\u003c/li\u003e\n\u003cli\u003eми впевнені, що співвідношення ціна-якість бренду Staff краще ніж у будь-якого з відомих вам брендів;\u003c/li\u003e\n\u003cli\u003eз 2014 року по сьогоднішній день ми відкрили 16 магазинів по Україні, при цьому у нас не було стратегії серйозного розвитку мережі, ми не ставили такої мети. Фізичні магазини відкривалися, якщо в місті було багато запитів від клієнтів, які хочуть прийти подивитися або поміряти і ми задовольнили їх;\u003c/li\u003e\n\u003cli\u003eжоден із магазинів Staff за всю історію не закрився. Були випадки переїздів в іншу вдалу локацію або більш просторе приміщення, але всі магазини успішно працюють та розвиваються. Це говорить про те, якщо ви зробили покупку один раз, то здебільшого станете нашим постійним клієнтом;\u003c/li\u003e\n\u003cli\u003eми підтримуємо спорт (переважно - єдиноборства), художників та інших творчих людей (малюємо на джинсовках, постійно шукаємо талановитих людей з крутими ідеями для співпраці і колаборацій, працюємо з тими, хто малює принти, патерни і т.д.);\u003c/li\u003e\n\u003cli\u003eу нас відмінна команда! Наші дизайнери постійно генерують круті ідеї, ІТ-відділ розробив для вас найзручніший сайт і додаток, маркетинг радує відмінним контентом, весь менеджмент заточений на те, щоб клієнт залишився задоволений. Виробництво, використовуючи тільки найякісніші тканини, фурнітуру та нове обладнання, працює виключно на якість.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cbr\u003e\n\u003cp\u003e\u003cb\u003eЯк з нами можна співпрацювати?\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003eНайбільше нас цікавить розвиток за кордоном. Якщо ви бачите перспективу бренду Staff у себе в країні, в місті за межами України, якщо ви займаєтеся продажем одягу та хочете бачити наш бренд у себе в магазині, на сайті або ж ви тільки плануєте відкрити магазин - пишіть нам: \u003ca href=\"mailto:staff.clothes2@gmail.com\"\u003estaff.clothes2@gmail.com\u003c/a\u003e \u003cbr\u003e Ми дамо кращі умови для співпраці, нам не потрібно платити за франшизу і ми впевнені в тому, що Staff повинен бути доступний не тільки в Україні.\u0026nbsp;\u003c/p\u003e\n\u003cp\u003eТак само ми плануємо відкриття ряду магазинів по Україні. Якщо ви проживаєте в місті, де немає нашого магазину і ви хотіли б стати нашим партнером - відкрити магазин Staff - пишіть нам на пошту \u003ca href=\"mailto:staff.clothes2@gmail.com\"\u003estaff.clothes2@gmail.com\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eЯкщо у вас є ідеї як зробити наш бренд краще, створити новий продукт, ви круто малюєте або у вас є ідеї принтів, ви постачальник нових тканин або технологій, якщо ви майбутній чемпіон в будь-якому виді спорту і вам потрібна підтримка - пишіть нам на пошту \u003ca href=\"mailto:staff.clothes2@gmail.com\"\u003estaff.clothes2@gmail.com\u003c/a\u003e\u003c/p\u003e\n\u003cp\u003eЯкщо ви хочете продавати у себе продукцію Staff за схемою \u0026laquo;дропшиппінг\u0026raquo; напишіть листа на скриньку \u003ca href=\"mailto:Staff.SalesDevelopment@gmail.com\"\u003eSTAFF.SALESDEVELOPMENT@GMAIL.COM\u003c/a\u003e , вкажіть посилання на торговельний майданчик, кількість передплатників або відвідуваність і дочекайтеся відповіді.\u003c/p\u003e\n\u003cbr\u003e\n\u003cp\u003e\u003cb\u003eМи цінуємо кожного нашого клієнта.\u003c/b\u003e\u003c/p\u003e\n\u003cp\u003e\u003cb\u003eДякуємо, що ви з нами!\u003c/b\u003e\u003c/p\u003e","anywhereInUkraine":"Новою Поштою в будь-який куточок України 1-3 дні.","DeliveryTimeMayChange":"(Терміни відправлення товару, можуть змінюватись продавцем)","visaOrMasterCard":"Банківською картою VISA або Master Card на нашому сайті або при отриманні замовлення накладеним платежем.","ifMoreThan3ReturnsBlocked":"\u003cbr\u003e\u003cbr\u003eУ разі, якщо клієнт не забирає замовлення у відділенні пошти більше 3 разів підряд, ми можемо тимчасово обмежити можливість \u003cb\u003eоплати при отриманні\u003c/b\u003e.\u003cbr\u003e\u003cbr\u003eУ такому випадку наступні замовлення оформлюються лише з повною передоплатою банківською картою.\u003cbr\u003eЦе допомагає нам підтримувати стабільний рівень сервісу для всіх клієнтів.\u003cbr\u003eДякуємо за розуміння 💙","qualityChecking":"Перевірка якості","receivingAtPostOffice":"Отримуючи товар на пошті, ви маєте право перш ніж оплачувати замовлення, приміряти, подивитися і оцінити наскільки якість замовленої продукції влаштовує вас. Чи підходить вам розмір і фасон, чи відповідає вашому очікуванню.","deliveryFistP":"Якщо вам не підійшов розмір, колір, або ж ви виявили інші проблеми, впродовж 14 днів після покупки, ви можете повернути нам товар або обміняти на інший.","deliverySecondP":"Потрібно подзвонити на сайт за одним з цих номерів:","deliveryThirtP":"і в телефонному режимі ми оформимо обмін або повернення товару.","shippingPaidByBuyerReturn":"Доставка оплачується покупцем, у разі повернення або обміну товару. ","easyReturnIsFree1":"Якщо відправити повернення за допомогою послуги ","easyReturnIsFree2":" - доставка безкоштовна!","easyReturn": greementTwoPSix":"«Замовлення» — вибір окремих позицій з переліку товарів, визначених Покупцем при розміщенні замовлення і здійсненні оплати.","subjectAgreement":"Предмет договору","publicOfferAgreementThreePOne":"Продавець зобов'язується передати у власність Покупця Товар, а Покупець зобов'язується оплатити і прийняти Товар на умовах даного Договору.","publicOfferAgreementThreePTwo":"Цей Договір регулює купівлю-продаж товарів в Інтернет-магазині, в тому числі:","publicOfferAgreementThreePThree":"добровільний вибір Покупцем товарів в Інтернет-магазині;","publicOfferAgreementThreePFour":"самостійне оформлення Покупцем замовлення в Інтернет-магазині; оплата Покупцем замовлення, оформленого в Інтернет-магазині;","publicOfferAgreementThreePFive":"обробка та доставка замовлення Покупцеві у власність на умовах цього Договору.","orderingProcedure":"Порядок оформлення замовлення","publicOfferAgreementFourPOne":"Покупець має право оформити замовлення на будь-який товар, представлений на сайті Інтернет-магазину і який є в наявності.","publicOfferAgreementFourPTwo":"Кожна позиція може бути представлена в замовленні в будь-якій кількості","publicOfferAgreementFourPThree":"При відсутності товару на складі, Менеджер компанії зобов'язаний поставити Покупця до відома (телефоном або через електронну пошту).","publicOfferAgreementFourPFour":"При відсутності товару Покупець має право замінити його товаром аналогічної моделі, відмовитися від даного товару, анулювати замовлення.","orderPayment":"Порядок оплати замовлення","cashOnDelivery":"Накладеним платежем","publicOfferAgreementFivePOne":"Оплата здійснюється за фактом отримання товару у відділеннях транспортних компаній за готівковий розрахунок в національній валюті.","publicOfferAgreementFivePTwo":"При ненадходженні грошових коштів, Інтернет-магазин залишає за собою право анулювати замовлення.","termsOrderDelivery":"Умови доставки замовлення","publicOfferAgreementSixPOne":"Доставка товарів, придбаних в Інтернет-магазині, здійснюєтьс жної якості в Інтернет-магазин проводиться за рахунок Покупця.","publicOfferAgreementTenPThree":"У разі повернення Покупцем товару належної якості, Інтернет-магазин повертає йому сплачену за товар грошову суму, за фактом повернення товару за вирахуванням компенсації витрат Інтернет-магазину пов'язаних з доставкою товару Покупцеві.","contractTime":"Термін дії договору","publicOfferAgreementElevenPOne":"Електронний договір вважається укладеним з моменту одержання особою, яка направила пропозицію укласти такий договір, відповіді про прийняття цієї пропозиції в порядку, визначеному частиною шостою статті 11 Закону України «Про електронну комерцію».","publicOfferAgreementElevenPTwo":"До закінчення терміну дії, цей Договір може бути розірваний за взаємною згодою сторін до початку процесу фактичної доставки товару, шляхом повернення грошових коштів.","publicOfferAgreementElevenPThree":"Сторони мають право розірвати цей Договір в односторонньому порядку, в разі невиконання однією із сторін умов цього Договору, та у випадках передбачених чинним законодавством України.","staffClothesOnTheOfficial":"Звертаємо вашу увагу, що інтернет-магазин «Staff clothes» на офіційному інтернет-сайті www.staff-clothes.com, має право, відповідно до законодавства України, надавати право користування інтернет платформою ФОП і юридичним особам для реалізації товару.","toStoresList":"Повернутися до списку магазинів","contacts":"Контакти","watchVideoFromStore":"Дивитися відео з магазину","readMore":"Детальніше","сommentss":"Коментарі","shop":"Магазин","orderNumber":"Номер замовлення","order":"Замовлення","date":"Дата","sum":"Сума","paymentMethod":"Спосіб оплати","product":"Товар","checkoutControl":"Оформлення замовлення","adReview":"Додати відгук","yourSize":"Ваш розмір:","clothingBrand":"Бренд одягу","isFree":"БЕЗКОШТОВНО","watch":"ДИВИТИСЯ","selectArea":"Оберіть область","selectAreaFirst":"Спочатку виберіть область","selectCityFirst":"Спочатку виберіть місто","clothesBrand":"Бренд одягу","freeIn":"БЕЗКОШТОВНО - у","see":"ДИВИТИСЬ","open":"відкрити","openInStaff":"Відкрити в програмі Staff","freeDownload":"Завантажити безкоштовно","phoneAlreadyInUse":"Користувач з вказаним номером телефону вже зареєстрований","phoneIsBanned":"Для номера телефону {{phoneNumber}} було занадто багато спроб отримання СМС. Зверніться в технічну підтримку.","IpIsBanned":"Для IP адреси {{ip}} було занадто багато спроб отримання СМС. Зверніться в технічну підтримку.","AnErrorHasOccurred":"Виникла помилка","moreDetails":"Детальніше","goTo":"перейти","showAll":"Показати повністю...","yourAccountHasBeenBlocked":"Ваш аккаунт заблокирован за нарушение правил использования сайта!","privacy":"Політика конфіденційності","privacyTextTop":"Інтернет-магазин Staff-clothes.com з великою повагою ставиться до конфіденційної (персональної) інформації всіх без винятку осіб, які відвідали сайт, а також тих, хто користується наданими сайтом послугами.  У зв'язку з чим, ми прагнемо захищати конфіденційність персональних даних (відомостей чи сукупність відомостей про фізичну особу, яка ідентифікована або може бути конкретно ідентифікована), тим самим створивши і забезпечивши максимально комфортні умови використання сервісів Сайту кожному Користувачеві.","privacyOnePOne":"Згідно Закону України «Про захист персональних даних» від 01 червня 2010 року № 2297-VI(надалі Закон)  під персональними даними розуміють відомості чи сукупність відомостей про фізичну особу, яка ідентифікована або може бути конкретно ідентифікована. Згідно Політики конфіденційності в поняття \"особистої інформації\" входить інформація, або частина інформації, котра дозволяє Вас ідентифікувати. Як правило сюди входить прізвище, ім’я та по-батькові, псевдонім (нік), адреса електронної пошти, адреса для доставки та номер телефону. Такі відомості ми можемо отримати безпосередньо від Вас, наприклад, при реєстрації на сайті, наданні контактних даних, інформації отриманої із банківської картки або платежів, а також іншу особисту інформацію, яку Ви добровільно надали нам.","privacyOnePTwo":"Користуючись сайтом або купуючи товар, пропонований на сайті, а також відповідаючи на необхідні питання в анкеті при реєстрації або оформленні покупки, Користувач підтверджує, що дає згоду  інтернет-магазину Staff-clothes.com та уповноваженим ним особам на обробку персональних даних, а також означає згоду з цією Політикою конфіденційості та умовами обробки персональних даних Користувача. Обробка персональних даних здійснюється відкрито і прозоро із застосуванням засобів та у спосіб, що відповідають визначеним цілям такої обробки.","privacyOnePThree":"У випадку незгоди з умовами Політики Користувач повинен припинити використання сайту інтернет-магазину Staff-clothes.com.","privacyOnePFour":"Ця Політика застосовується тільки до сайту інтернет-магазину Staff-clothes.com. Інтернет-магазин Staff-clothes.com не контролює і не несе відповідальність за сайти третіх осіб, на які Користувач може перейти по посиланнях, доступним на сайті інтернет-магазину Staff-clothes.com.","privacyOnePFive":"Персональні дані мають бути точними, достовірними та оновлюватися в міру потреби, визначеної метою їх обробки. Склад та зміст персональних даних мають бути відповідними, адекватними та ненадмірними стосовно визначеної мети їх обробки. Адміністрація сайту не перевіряє достовірність персональних даних, що надаються Користувачем сайту Інтернет-магазину.","privacyOnePSix":"Персональні дані можуть надаватися Користувачем самостійно або їх збір може автоматично здійснювати сайт при його використанні. Якщо не вказано інше, сайт Staff-clothes.com.  використовує файли «cookie» (або інші засоби відстеження) для ідентифікації користувачів і запам'ятовування встановлених ними глобальних параметрів налаштування виключно в цілях надання послуги Користувачеві.","privacyOnePSeven":"Користувач визнає, що у разі недбалого ставлення самим Користувачем до безпечного зберігання свого логіна і пароля, що дає доступ до його персональних даних, треті особи можуть отримати несанкціонований доступ до облікового запису, персональних і інших даних Користувача. Інтернет-магазин Staff-clothes.com не несе відповідальність за збитки завдані таким доступом. Ми рекомендуємо Користувачам використовувати складні паролі, які складаються з цифр і букв.","privacyGeneralData":"Використання та мета збору персональних даних","privacyTwoPText":"Особиста інформація відвідувачів сайту, зібрана при реєстрації,  використовується Інтернет-магазином Staff-clothes.com для надання послуг у відповідності з Вашими потребами, в першу чергу для надання послуг з продажу і доставки замовлених Вами товарів, а також для відповідей на Ваші запитання. Також ми можемо використовувати Вашу контактну інформацію в поштових відправленнях, а саме повідомляти Вас про нові можливості, акції та інші новини. Інтернет-магазин Staff-clothes.com збирає дані для зв'язку з Користувачем, в тому числі подання відповідного повідомлення про надання послуги, інформування Користувача про наявність товару, підтвердження замовлення, доставки замовлених Користувачем товарів, для зв'язку кур'єрської служби з Користувачем, а також для обробки запитів і заявок від Користувача.","privacyTwoPTwo":"Ми діємо відповідно до цієї Політики конфіденційності, на підставі Положення про обробку і захист персональних даних та на підставі чинного законодавства України.","privacyTwoPThree":"Ми маємо право зберігати Персональні дані стільки, скільки необхідно для реалізації мети, що зазначена у даній Політиці або у строки, встановлені чинним законодавством України або до моменту видалення Вами цих даних.","privacyTwoPFour":"До обслуговування даних користувачів належать збір, реєстрація, накопичення, зберігання, адаптація, зміна, оновлення, використання (в тому числі передача партнерам, в тому числі, залученим як спеціалізовані ресурси, як то, але не обмежуючись, Facebook, Goоglе і тому подібні).","privacyProcessingPersonalData":"Умови надання доступу до інформації","privacyThreePOne":"Ми не передаємо персональні дані Користувача третім особам крім випадків визначених законодавством України. Надання доступу до особистої інформації іншим компаніям і приватним особам можливе лише за таких наступних обставин:\n•\tмає місце наявність дозволу Користувача. Для передачі будь-якої конфіденційної інформації потрібна явна згода Користувача.\n•\tу випадках визначених чинним законодавством України, а також у випадках запобігання злочину або завдання шкоди нам або третім особам, в інтересах національної безпеки, національного добробуту та прав людини.","privacyThreePTwo":"Розкриття персональних даних Користувача проводиться при замовленні Користувачем товарів в інтернет-магазині Staff-clothes.com. Зокрема Користувач погоджується з тим, що інтернет-магазин Staff-clothes.com має право передавати персональні дані кур'єрським службам, організаціям поштового зв'язку, операторам електрозв'язку, виключно з метою виконання замовлення Користувача, оформленого на сайті інтернет-магазину Staff-clothes.com, включаючи доставку Товару.","privacyThreePThree":"Ми вживаємо всіх необхідних заходів для захисту даних від несанкціонованого доступу, зміни, розкриття чи знищення. До цих заходів належать, зокрема, внутрішня перевірка процесів збору, зберігання та обробки даних і заходів безпеки, включаючи відповідне шифрування і заходи щодо забезпечення фізичної безпеки даних для запобігання неавторизованого доступу до систем, в яких ми зберігаємо особисті дані.","databaseAccessTerms":"Умови надання доступу до бази даних","privacyFourPOne":"Ми не передаємо персональні дані Користувача третім особам крім випадків визначених законодавством України.","privacyFourPTwo":"Розкриття персональних даних Користувача проводиться при замовленні Користувачем товарів в інтернет-магазині Staff-clothes.com. Зокрема Користувач погоджується з тим, що інтернет-магазин Staff-clothes.com має права передавати персональні дані кур'єрським службам, організаціям поштового зв'язку, операторам електрозв'язку, виключно з метою виконання замовлення Користувача, оформленого на сайті інтернет-магазину Staff-clothes.com, включаючи доставку Товару.","privacyFourPThree":"При втраті або розголошення персональних даних інтернет-магазин Staff-clothes.com інформує Користувача про втрату або розголошення персональних даних.","privacyFourPFour":"Інтернет-магазин Staff-clothes.com приймає необхідні організаційні та технічні заходи для захисту персональної інформації Користувача від неправомірного або випадкового доступу, знищення, перекручення, блокування, копіювання, поширення, а також від інших неправомірних дій третіх осіб.","changingUserPersonalInfo":"Зміна користувачем персональної інформації","privacyFivePOne":"Користувач може в будь-який момент змінити (оновити, доповнити, видалити) надану їм персональну інформацію або її частину, скориставшись функцією входу в \"Особистий кабінет\".","privacyPolicyChange":"Зміна політики конфіденційності","privacySixPOne":"Користувач приймає умови цієї політики конфіденційності і враховує, що дана політика конфіденційності може час від часу змінюватися. Зміни, що вносяться до політики конфіденційності, публікуються на цій сторінці. Будь ласка, періодично переглядайте ці умови, щоб бути поінформованими про те, як інтернет-магазин Staff-clothes.com захищає персональні дані своїх користувачів.","feedbackQuestionsSuggestions":"Зворотній зв'язок","privacySevenPOne":"Всі пропозиції або питання з приводу цієї Політики конфіденційності, слід надсилати в службу підтримки користувачів інтернет-магазину Staff-clothes.com, використовуючи електронну адресу:","cancelOrder":"Скасувати замовлення","areSure":"Ви дійсно хочете скасувати замовлення?","lowCancel":"Скасувати","productReviw":"Відгуки про товар","Answer":"Відповісти","subscribeSize":"Підписатися на розмір","WeWillCertainlyWrite":"Ми обов'язково напишемо вам, коли потрібний розмір з'явиться в наявності. Тільки вкажіть e-mail і / або номер телефону.","successfullySubscribedSizes":"Ви успішно підписалися","successfully
